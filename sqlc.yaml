version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations/000001_init.up.sql
    gen:
      go:
        package: sqlc
        out: internal/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: bigint
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
